name: build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore:
      - "**.md"
      - ".gitignore"

permissions:
  contents: write

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python app.py --selftest
      - run: >
          pyinstaller --noconfirm --clean --windowed
          --name stacklens
          --osx-bundle-identifier com.local.stacklens
          app.py
      - uses: actions/upload-artifact@v4
        with:
          name: stacklens-macos
          path: dist/stacklens.app

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pyinstaller
      - run: python app.py --selftest
      - run: >
          pyinstaller --noconfirm --clean --windowed --onefile
          --name stacklens
          app.py
      - uses: actions/upload-artifact@v4
        with:
          name: stacklens-windows
          path: dist/stacklens.exe

  release:
    needs: [macos, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Package release assets
        run: |
          mkdir -p release/stacklens.app
          cp -R artifacts/stacklens-macos/Contents release/stacklens.app/Contents
          chmod +x release/stacklens.app/Contents/MacOS/stacklens
          ditto -c -k --keepParent release/stacklens.app release/stacklens-macos.zip
          cp artifacts/stacklens-windows/stacklens.exe release/stacklens.exe

          mac_sha="$(shasum -a 256 release/stacklens-macos.zip | awk '{print $1}')"
          win_sha="$(shasum -a 256 release/stacklens.exe | awk '{print $1}')"
          sed \
            -e "s|<macos zip 的 sha256>|${mac_sha}|" \
            -e "s|<exe 的 sha256>|${win_sha}|" \
            NOTES.md > release-notes.md
      - name: Verify packaged macOS app
        run: release/stacklens.app/Contents/MacOS/stacklens --selftest
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload v1.0.0 \
              release/stacklens-macos.zip release/stacklens.exe --clobber
          else
            gh release create v1.0.0 \
              --repo "$GITHUB_REPOSITORY" \
              --title "v1.0.0 StackLens" \
              --notes-file release-notes.md \
              --latest \
              release/stacklens-macos.zip release/stacklens.exe
          fi
